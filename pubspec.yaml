name: plant_care
description: PlantCare - Monitoramento inteligente de plantas
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Estado e injeção de dependência
  provider: ^6.1.1
  get_it: ^7.6.7

  # Navegação
  go_router: ^13.0.0

  # UI
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  shimmer: ^3.0.0

  # Utilitários
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^16.3.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/vegetables.json
    - assets/logo-plantcare.png
